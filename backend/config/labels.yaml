# Все тексты, которые видит пользователь: статусы, кнопки, история заявки, причины решений.
# TODO(участник 1): переписать тексты простым языком для предпринимателя. Коды (ключи) не менять.
# В фигурных скобках — подстановки, их нужно сохранить.

# Статусы заявки.
#   label — короткое название;
#   description — для клиента: что происходит и что будет дальше;
#   employee_description — для сотрудника банка.
statuses:
  DRAFT:
    label: "Черновик"
    description: "Заявка ещё не отправлена. Проверьте данные и нажмите «Отправить заявку»."
    employee_description: "Клиент заполняет заявку."
  SUBMITTED:
    label: "Отправлена"
    description: "Мы получили заявку и сейчас начнём её проверять. Это займёт несколько секунд."
    employee_description: "Заявка отправлена и ждёт автоматической обработки."
  VALIDATION:
    label: "Проверяем данные"
    description: "Проверяем, что все данные заполнены и указаны без ошибок."
    employee_description: "Автоматическая проверка полноты и корректности анкеты."
  NEEDS_INFO:
    label: "Нужны уточнения"
    description: "Чтобы продолжить, нам нужно немного больше информации. Посмотрите, что именно нужно, исправьте данные или загрузите документы и нажмите «Отправить уточнения»."
    employee_description: "Ждём ответа клиента на запрос уточнений."
  CHECKS:
    label: "Запрашиваем сведения"
    description: "Запрашиваем сведения о компании в госреестре и кредитную историю в бюро. Обычно это занимает меньше минуты."
    employee_description: "Идут запросы в ЕГРЮЛ/ЕГРИП и БКИ."
  SCORING:
    label: "Оцениваем заявку"
    description: "Рассчитываем условия кредита на основе данных о вашем бизнесе."
    employee_description: "Скоринг и автоматическое решение."
  MANUAL_REVIEW:
    label: "На рассмотрении у специалиста"
    description: "Заявку изучает кредитный специалист. Обычно это занимает до одного рабочего дня. Мы покажем решение здесь."
    employee_description: "Требуется решение сотрудника: одобрить, сделать встречное предложение, запросить уточнения или отказать."
  OFFER_SENT:
    label: "Есть предложение"
    description: "Банк готов выдать кредит. Посмотрите условия и решите, принимаете ли вы их."
    employee_description: "Клиенту отправлено предложение, ждём ответа."
  OFFER_ACCEPTED:
    label: "Предложение принято"
    description: "Вы приняли условия. Осталось подписать кредитный договор."
    employee_description: "Клиент принял предложение, ждём подписания."
  SIGNING:
    label: "Подписание"
    description: "Договор подписан. Перечисляем деньги на ваш расчётный счёт."
    employee_description: "Договор подписан, идёт выдача средств."
  ISSUED:
    label: "Кредит выдан"
    description: "Деньги перечислены на расчётный счёт компании. Условия и размер ежемесячного платежа — в кредитном договоре в разделе «Документы»."
    employee_description: "Кредит выдан."
  REJECTED:
    label: "Отказ"
    description: "К сожалению, сейчас банк не может выдать кредит. Причина указана в истории заявки. Вы можете подать новую заявку позже."
    employee_description: "По заявке принят отказ."
  CLIENT_DECLINED:
    label: "Отказ от предложения"
    description: "Вы отказались от предложения банка. Если передумаете — подайте новую заявку."
    employee_description: "Клиент отказался от предложения."
  CANCELLED:
    label: "Заявка отозвана"
    description: "Вы отозвали заявку. Если понадобится кредит — создайте новую."
    employee_description: "Клиент отозвал заявку."

# Кнопки (available_actions).
#   label — текст кнопки; confirm_text — текст подтверждения перед действием (если нужен).
actions:
  edit:
    label: "Редактировать"
  upload_document:
    label: "Загрузить документ"
  submit:
    label: "Отправить заявку"
  cancel:
    label: "Отозвать заявку"
    confirm_text: "Отозвать заявку? Это действие нельзя отменить."
  provide_info:
    label: "Отправить уточнения"
  accept_offer:
    label: "Принять предложение"
  decline_offer:
    label: "Отказаться от предложения"
    confirm_text: "Отказаться от предложения? Это действие нельзя отменить."
  sign:
    label: "Подписать договор"
    confirm_text: "Подтвердите подписание кредитного договора (имитация электронной подписи)."
  approve:
    label: "Одобрить"
  counter_offer:
    label: "Сделать встречное предложение"
  request_info:
    label: "Запросить уточнения"
  reject:
    label: "Отказать"
    confirm_text: "Отказать клиенту? Это действие нельзя отменить."


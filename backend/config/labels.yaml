  purpose_not_allowed: "цель «{purpose}» не подходит для продукта «{product}», выберите другую цель или продукт"
  purpose_comment_required: "опишите цель кредита в комментарии"
  product_inactive: "продукт «{product}» сейчас недоступен, выберите другой"
  inn_invalid: "в профиле компании ошибка в ИНН, обратитесь в банк"
  expenses_too_high: "расходы получились больше выручки, проверьте цифры"
  payments_too_high: "платежи по кредитам получились больше выручки, проверьте цифры"

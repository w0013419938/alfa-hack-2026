  send_to_manual_review: "Заявку передали кредитному специалисту"
  auto_request_info: "Нужны дополнительные документы"
  technical_error: "Заявку передали кредитному специалисту"
  provide_info: "Уточнения отправлены в банк"
  cancel: "Заявка отозвана"
  approve: "Специалист одобрил заявку"
  counter_offer: "Специалист предложил изменённые условия"

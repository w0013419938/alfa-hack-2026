# Все тексты, которые видит пользователь: статусы, кнопки, история заявки, причины решений.
# Тексты написаны по материалам участника 1 (docs/research.md): простые слова, без «госреестр», «бюро», «дн.» и «мес.» в основном тексте.
# Коды (ключи) не менять.
# В фигурных скобках стоят подстановки, их нужно сохранить.

# Статусы заявки.
#   label: короткое название;
#   description: для клиента (что происходит и что будет дальше);
#   employee_description: для сотрудника банка.
statuses:
  DRAFT:
    label: "Черновик"
    description: "Вы начали заявку, но не отправили её. Всё сохранено. Проверьте данные и нажмите «Отправить заявку»."
    employee_description: "Клиент заполняет заявку."
  SUBMITTED:
    label: "Отправлена"
    description: "Заявка отправлена. Скоро начнём проверку."
    employee_description: "Заявка отправлена и ждёт автоматической обработки."
  VALIDATION:
    label: "Проверяем данные"
    description: "Проверяем, все ли данные заполнены верно."
    employee_description: "Автоматическая проверка полноты и корректности анкеты."
  NEEDS_INFO:
    label: "Нужны уточнения"
    description: "Чтобы продолжить, нам нужно немного больше информации. Посмотрите, что именно нужно, исправьте данные или загрузите документы и нажмите «Отправить уточнения»."
    employee_description: "Ждём ответа клиента на запрос уточнений."
  CHECKS:
    label: "Проверяем компанию"
    description: "Сверяем данные с открытыми реестрами и смотрим кредитную историю. Обычно это занимает меньше минуты."
    employee_description: "Идут запросы в ЕГРЮЛ/ЕГРИП и БКИ."
  SCORING:
    label: "Оцениваем заявку"
    description: "Считаем, какой платёж вам по силам."
    employee_description: "Скоринг и автоматическое решение."
  MANUAL_REVIEW:
    label: "На рассмотрении у специалиста"
    description: "Заявку изучает кредитный специалист. Обычно это занимает до одного рабочего дня. Мы покажем решение здесь."
    employee_description: "Требуется решение сотрудника: одобрить, сделать встречное предложение, запросить уточнения или отказать."
  OFFER_SENT:
    label: "Есть предложение"
    description: "Банк готов выдать кредит. Посмотрите условия и решите, принимаете ли вы их."
    employee_description: "Клиенту отправлено предложение, ждём ответа."
  OFFER_ACCEPTED:
    label: "Предложение принято"
    description: "Договор готов. Проверьте условия и подпишите."
    employee_description: "Клиент принял предложение, ждём подписания."
  SIGNING:
    label: "Подписание"
    description: "Договор подписан. Перечисляем деньги на ваш расчётный счёт."
    employee_description: "Договор подписан, идёт выдача средств."
  ISSUED:
    label: "Кредит выдан"
    description: "Деньги перечислены на расчётный счёт компании. Условия и размер ежемесячного платежа указаны в кредитном договоре, он лежит в разделе «Документы»."
    employee_description: "Кредит выдан."
  REJECTED:
    label: "Отказ"
    description: "Сейчас мы не можем одобрить заявку. Причина указана в заявке. Когда ситуация изменится, можно подать новую заявку."
    employee_description: "По заявке принят отказ."
  CLIENT_DECLINED:
    label: "Отказ от предложения"
    description: "Вы отказались от предложения банка. Если передумаете, подайте новую заявку."
    employee_description: "Клиент отказался от предложения."
  CANCELLED:
    label: "Заявка отозвана"
    description: "Вы отозвали заявку. Если понадобится кредит, создайте новую."
    employee_description: "Клиент отозвал заявку."

# Кнопки (available_actions).
#   label: текст кнопки; confirm_text: текст подтверждения перед действием (если нужен).
actions:
  edit:
    label: "Редактировать"
  upload_document:
    label: "Загрузить документ"
  submit:
    label: "Отправить заявку"
  cancel:
    label: "Отозвать заявку"
    confirm_text: "Отозвать заявку? Это действие нельзя отменить."
  provide_info:
    label: "Отправить уточнения"
  accept_offer:
    label: "Принять предложение"
  decline_offer:
    label: "Отказаться от предложения"
    confirm_text: "Отказаться от предложения? Это действие нельзя отменить."
  sign:
    label: "Подписать договор"
    confirm_text: "Подтвердите подписание кредитного договора (имитация электронной подписи)."
  approve:
    label: "Одобрить"
  counter_offer:
    label: "Сделать встречное предложение"
  request_info:
    label: "Запросить уточнения"
  reject:
    label: "Отказать"
    confirm_text: "Отказать клиенту? Это действие нельзя отменить."

# Шкала этапов заявки (поле progress в ответе API). Коды этапов не менять.
progress_steps:
  submitted: "Подача заявки"
  validation: "Проверка данных"
  checks: "Реестры и кредитная история"
  scoring: "Оценка заявки"
  decision: "Решение банка"
  signing: "Подписание"
  issued: "Выдача денег"

# Состояния этапа на шкале
progress_states:
  done: "Готово"
  current: "Идёт проверка"
  action: "Ждём вас"
  stopped: "Остановлено"
  upcoming: "Впереди"

# Что написать под этапом, где процесс остановился, по статусу заявки (если статуса здесь нет, берётся stopped)
progress_stopped_labels:
  REJECTED: "Отказ"
  CLIENT_DECLINED: "Вы отказались"
  CANCELLED: "Заявка отозвана"

# Подписи калькулятора платежа
calculator:
  note: "Расчёт по ставке от {rate}% годовых. После оценки заявки ставка может вырасти до {max_rate}%."
  note_differentiated: "Расчёт по ставке от {rate}% годовых. После оценки заявки ставка может вырасти до {max_rate}%. Для сравнения: в прототипе банк оформляет кредит с одинаковым платежом каждый месяц."
  label_annuity: "Платёж в месяц (примерно)"
  label_differentiated: "Первый платёж (примерно)"
  caption_annuity: "Одинаковый каждый месяц, {term_text}"
  caption_differentiated: "Дальше платёж уменьшается, последний будет {last} ₽"
  type_annuity: "Одинаковый каждый месяц"
  type_differentiated: "Уменьшается со временем"


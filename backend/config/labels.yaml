# Кто выполнил действие (в истории)
actors:
  client_self: "Вы"            # клиент смотрит свою заявку
  client: "Клиент"             # сотрудник смотрит заявку клиента
  employee: "Кредитный специалист"
  system: "Система"

# Комментарии системы в истории заявки. Первая буква комментария делается заглавной автоматически.
system_comments:
  validation_failed: "Исправьте, пожалуйста: {problems}"
  checks_completed: "Проверили: {sources}"
  checks_with_errors: "Не удалось получить данные: {sources}. Заявку проверит специалист."
  auto_approve: "Условия: {amount} ₽ на {term_text} под {rate}% годовых."
  auto_counter_offer: "Мы изменили условия. {reasons} Так платёж будет посильным при вашей выручке. Предлагаем: {amount} ₽ на {term_text} под {rate}% годовых."
  auto_reject: "Что не подошло: {reasons_inline}"
  send_to_manual_review: "{reasons}"
  technical_error: "При автоматической обработке произошла техническая ошибка. Заявку проверит специалист."
  issue: "На расчётный счёт компании перечислено {amount} ₽ (имитация выдачи)."
  sign: "Договор подписан простой электронной подписью (имитация)."


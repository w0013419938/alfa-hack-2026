# Кредитные продукты для малого и микробизнеса.
# working_capital и equipment взяты из docs/reference/participant2-config.yaml (участник 2).
#
# Как устроено:
# - code: постоянный код продукта (на него ссылаются заявки, менять нельзя);
# - purposes: коды целей из dictionaries.yaml, для которых подходит продукт;
# - суммы в рублях, сроки в месяцах, ставка в % годовых (к ней добавляется надбавка по грейду из decision.yaml);
# - required_fields: какие поля анкеты обязательны (список возможных полей лежит в labels.yaml, раздел fields);
# - decision_days: за сколько рабочих дней обычно принимается решение (используется в подборе продукта).
# Таблица products в БД обновляется из этого файла при каждом старте бэкенда.

version: "products-participant2-1"

products:
  # TODO(участник 2): продукта нет в файле участника 2, но он используется:
  #   backend/seed/applications.json (три демо-заявки фоновых компаний),
  #   backend/tests/unit/test_validation_recommend_feed.py (подбор продукта и валидация),
  #   backend/tests/e2e/test_api_rules.py (список продуктов в GET /products).
  #   Удалить или оставить, решает участник 2.
  - code: express
    name: "Экспресс-кредит"
    description: "Кредит без залога с быстрым решением. Деньги можно потратить на любые цели бизнеса."
    suitable_for: "Когда деньги нужны срочно и сумма небольшая: закупка, ремонт, кассовый разрыв."
    purposes: [working_capital, goods_purchase, equipment, vehicles, expansion, other]
    min_amount: 100000
    max_amount: 3000000
    min_term_months: 3
    max_term_months: 24
    base_rate: 21.9
    requires_collateral: false
    decision_days: 1
    required_fields: [amount, term_months, purpose_code, monthly_revenue, monthly_expenses, current_loan_payments]

  - code: working_capital
    name: "Оборотный кредит"
    description: "Пополнение оборотных средств: закупка товаров и сырья, оплата поставщикам, налоги и зарплаты. Без залога, платежи равными суммами каждый месяц."
    suitable_for: "Когда бизнесу нужно закрыть разрыв между оплатой поставщикам и поступлениями от покупателей."
    purposes: [working_capital, goods_purchase]
    min_amount: 100000
    max_amount: 3000000
    min_term_months: 3
    max_term_months: 24
    base_rate: 21.0
    requires_collateral: false
    decision_days: 3
    required_fields: [amount, term_months, purpose_code, monthly_revenue, monthly_expenses, current_loan_payments]

  - code: equipment
    name: "Кредит на оборудование"
    description: "Покупка оборудования и техники для бизнеса. Первоначальный взнос от 20%, залогом служит приобретаемое оборудование."
    suitable_for: "Когда вы покупаете станок, технику или транспорт для работы и можете внести часть стоимости сами."
    purposes: [equipment, vehicles]
    min_amount: 500000
    max_amount: 15000000
    min_term_months: 12
    max_term_months: 60
    base_rate: 18.0
    requires_collateral: true
    decision_days: 5
    required_fields: [amount, term_months, purpose_code, monthly_revenue, monthly_expenses, current_loan_payments, collateral_description]

  # TODO(участник 2): продукта нет в файле участника 2, но на его цель ссылается справочник:
  #   backend/config/dictionaries.yaml (цель refinancing «Рефинансирование других кредитов»).
  #   Без этого продукта для цели не останется ни одного подходящего кредита.
  - code: refinancing
    name: "Рефинансирование"
    description: "Перекредитование займов в других банках, чтобы снизить ежемесячный платёж."
    suitable_for: "Когда у бизнеса уже есть кредиты и платёж по ним хочется уменьшить."
    purposes: [refinancing]
    min_amount: 300000
    max_amount: 10000000
    min_term_months: 12
    max_term_months: 60
    base_rate: 16.5
    requires_collateral: false
    decision_days: 3
    required_fields: [amount, term_months, purpose_code, monthly_revenue, monthly_expenses, current_loan_payments]

# Подбор продукта (POST /products/recommend): за каждое совпадение продукт получает баллы.
# TODO(участник 2): уточнить веса. Тексты объяснений написаны по материалам участника 1.
recommendation:
  weights:
    purpose: 4      # продукт подходит под цель
    amount: 2       # сумма в пределах продукта
    term: 2         # срок в пределах продукта
    speed: 1        # решение успеваем принять так быстро, как нужно клиенту
    collateral: 1   # требования к залогу выполнимы
  # Сколько дней клиент готов ждать решения при каждом варианте ответа «как быстро нужны деньги»
  urgency_days:
    asap: 1
    week: 5
    month: 30
  texts:
    purpose_ok: "Подходит для цели «{purpose}»"
    purpose_bad: "Не предназначен для цели «{purpose}»"
    amount_ok: "Сумма {amount} ₽ входит в лимит продукта (от {min_amount} до {max_amount} ₽)"
    amount_bad: "Сумма {amount} ₽ вне лимита продукта (от {min_amount} до {max_amount} ₽)"
    term_ok: "Срок {term_text} подходит (от {min_term} до {max_term_text})"
    term_bad: "Срок {term_text} не подходит (от {min_term} до {max_term_text})"
    speed_ok: "Решение обычно за {days_text}. Успеем к вашему сроку"
    speed_bad: "Решение обычно за {days_text}. Это дольше, чем вам удобно"
    collateral_ok: "Залог не нужен"
    collateral_have: "Нужен залог. Он у вас есть, поэтому ставка будет ниже"
    collateral_bad: "Нужен залог, а вы указали, что его нет"

# Правила персональной ленты подсказок (GET /feed).
# Сами подсказки лежат в seed/feed_items.json.
# TODO(участник 3): уточнить веса и тексты «почему показано».
#
# Как работает отбор:
# - У каждой подсказки могут быть условия: okved_prefixes, company_types, application_statuses, product_codes.
# - Подсказка показывается, только если выполнены ВСЕ её условия.
# - Подсказка без условий общая, её видят все.
# - Порядок: сумма весов совпавших условий + priority подсказки; показываем max_items лучших.

max_items: 6

weights:
  application_status: 4
  product: 3
  okved: 3
  company_type: 1

# Тексты «почему показано». В фигурных скобках стоят подстановки.
reasons:
  application_status: "Ваша заявка сейчас в статусе «{status_label}»"
  product: "Вы оформляете продукт «{product_name}»"
  okved: "Подобрано для вашей отрасли: {industry}"
  company_type: "Актуально для формы бизнеса «{company_type}»"
  general: "Полезно всем предпринимателям"

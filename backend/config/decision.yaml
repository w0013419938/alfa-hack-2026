# Правила кредитного решения (отдельно от скоринга).
# TODO(участник 2): заменить пороги и надбавки на финальные значения.
#
# Порядок принятия решения (app/domain/decision.py):
#   1. Стоп-факторы → отказ.
#   2. Ошибки внешних сервисов (ЕГРЮЛ/БКИ не ответили) → ручное рассмотрение.
#   3. Не хватает данных (правила needs_info) → запрос уточнений.
#   4. Решение по грейду (grade_rules).
#   5. Если долговая нагрузка выше max_debt_to_income считаем встречное предложение с меньшей суммой / дольше сроком.

version: "decision-draft-1"

stop_factors:
  # Статусы компании в ЕГРЮЛ, при которых кредит не выдаём
  forbidden_company_statuses: [liquidated, liquidating, bankrupt]
  # Текущая (не погашенная) просрочка в БКИ больше этого числа дней → отказ
  max_current_overdue_days: 30
  # Бизнес моложе этого числа месяцев → отказ
  min_business_age_months: 3

# Что делать для каждого грейда:
#   approve:        предложение на запрошенных условиях
#   counter_offer:  встречное предложение, сумма = запрошенная × amount_share (и не выше доступной по нагрузке)
#   manual_review:  передать сотруднику
#   reject:         отказ
# rate_premium: надбавка к базовой ставке продукта, процентных пунктов
grade_rules:
  A: {decision: approve, rate_premium: 0.0}
  B: {decision: approve, rate_premium: 2.0}
  C: {decision: counter_offer, rate_premium: 4.0, amount_share: 0.7}
  D: {decision: manual_review, rate_premium: 6.0}
  E: {decision: reject, rate_premium: 8.0}

# Максимальная долговая нагрузка (платежи по всем кредитам / месячная выручка)
max_debt_to_income: 0.5

# Подбор встречного предложения
counter_offer:
  term_step_months: 6        # с каким шагом пробуем увеличивать срок
  amount_round_to: 10000     # округляем сумму вниз до этого шага
  if_impossible: manual_review   # если подобрать условия не удалось: manual_review или reject

# Если стоп-факторов нет, но внешний сервис не ответил
integration_error_decision: manual_review

# Правила «не хватает данных» → запрос уточнений
needs_info:
  # Нет годовой выручки по отчётности (например, новый ИП) → просим выписку по счёту
  missing_company_revenue:
    enabled: true
    document_kind: bank_statement
    comment: "Нам не хватает данных о выручке вашей компании по отчётности. Они нужны, чтобы понять, какой платёж вам по силам. Загрузите, пожалуйста, выписку по расчётному счёту за последние 6 месяцев."

# Сколько дней действует предложение
offer_valid_days: 30

# Если по заявке нет скоринга (например, БКИ не ответило), сотрудник по умолчанию предлагает ставку этого грейда
manual_review_default_grade: C

# Проверки на этапе VALIDATION (разумность цифр в анкете)
validation:
  # Расходы не могут быть больше выручки в столько раз
  max_expenses_to_revenue: 1.0
  # Текущие платежи по кредитам не могут быть больше выручки в столько раз
  max_loan_payments_to_revenue: 1.0

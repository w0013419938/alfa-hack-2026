# nginx отдаёт собранный фронт и проксирует /api на бэкенд — браузер ходит на один адрес, CORS не нужен.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка документов до 10 МБ (лимит самого бэкенда) + запас на заголовки multipart
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Схема API и Swagger тоже доступны через фронт
    location = /openapi.json { proxy_pass http://backend:8000; }
    location /docs { proxy_pass http://backend:8000; }

    # Собранные файлы с хешем в имени можно кешировать надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Маршруты приложения (React Router) — всегда index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }
}
